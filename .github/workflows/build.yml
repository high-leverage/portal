name: Build và đăng web khách hàng

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "*/10 0-10 * * 1-5"
    - cron: "0 12 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - name: Khôi phục cache cổ tức
        uses: actions/cache@v4
        with:
          path: cache
          key: dividends-${{ github.run_id }}
          restore-keys: dividends-
      - name: Đọc Google Sheet và mã hóa dữ liệu từng khách
        run: node build-data.mjs
        env:
          GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
          GOOGLE_PRIVATE_KEY: ${{ secrets.GOOGLE_PRIVATE_KEY }}
          PORTAL_ACCOUNTS: ${{ secrets.PORTAL_ACCOUNTS }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
